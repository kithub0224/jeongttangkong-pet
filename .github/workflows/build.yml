name: Build jeongttangkong

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install PySide6 pyinstaller pillow

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --noconfirm --windowed --onefile --name jeongttangkong --icon icon.ico --add-data "assets;assets" pet.py

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name jeongttangkong --icon icon.png --add-data "assets:assets" pet.py
          cd dist && ditto -c -k --keepParent jeongttangkong.app jeongttangkong-mac.zip

      - name: Keep build files
        uses: actions/upload-artifact@v4
        with:
          name: jeongttangkong-${{ runner.os }}
          path: |
            dist/jeongttangkong.exe
            dist/jeongttangkong-mac.zip
          if-no-files-found: ignore

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/jeongttangkong.exe
            dist/jeongttangkong-mac.zip
